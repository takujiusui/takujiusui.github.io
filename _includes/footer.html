<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">

    <div class="footer-col-wrapper">
      <div class="footer-col">
        {%- if site.author %}
          <ul class="contact-list">
            {% if site.author.name -%}
              <div class="p-name">{{ site.author.name | escape }}</div>
            {% endif -%}

            {% if site.author.email -%}
              <div align="right">
                <a class="u-email" href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
              </div>
            {%- endif %}
            <div>&nbsp;</div>
            <div align="right">&copy; Usui Lab</div>
          </ul>
        {%- endif %}
      </div>

    </div>

    <div class="footer-logo" style="padding-left: 12px;">
  <a href="https://eeb.yale.edu/" target="_blank" rel="noopener">
    <img src="{{ '/assets/yale-logo.png' | relative_url }}" alt="Yale University" height="40">
  </a>
</div>

    <div class="social-links">
      {%- include social.html -%}
    </div>

  </div>
</footer>
